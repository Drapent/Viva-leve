name: Keep-Alive 24-7 (Anti-Sleep)

on:
  schedule:
    # A cada 10 minutos (Render dorme apenas após 15 minutos de inatividade)
    - cron: '*/10 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  anti_sleep:
    name: Ping Anti-Sleep Render 24/7
    runs-on: ubuntu-latest
    steps:
      - name: Ping Servidor VivaLeve
        run: |
          echo "========================================================"
          echo "Disparando ping Anti-Sleep para https://viva-leve.onrender.com"
          echo "========================================================"
          
          # Tentativa principal no endpoint /health
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 https://viva-leve.onrender.com/health || echo "FAIL")
          echo "Status HTTP retornado: $STATUS"
          
          if [ "$STATUS" = "200" ]; then
            echo "✅ Servidor VivaLeve acordado e respondendo normalmente!"
          else
            echo "⚠️ Tentando segundo endpoint de contingência (/api/version)..."
            curl -sS -m 30 https://viva-leve.onrender.com/api/version || true
          fi
          
          echo "Operação Anti-Sleep concluída com sucesso."
