services:
  - type: web
    name: vivaleve
    env: python
    buildCommand: pip install -r requirements.txt && python backend/seed_foods.py && python backend/seed_restaurants.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
