<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Arredondado com Sombra Suave -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)" />

  <!-- Círculo Interno Brilhante -->
  <circle cx="256" cy="256" r="210" stroke="white" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="16 12"/>

  <!-- Folha Saudável Esquerda -->
  <path d="M150 330 C130 230 180 160 256 160 C256 240 220 330 150 330 Z" fill="url(#leafGrad)" />
  <path d="M150 330 Q210 240 256 160" stroke="#A7F3D0" stroke-width="8" stroke-linecap="round" />

  <!-- Fogo de Ofensiva / Duolingo Flame (Centro) -->
  <g filter="url(#glow)">
    <path d="M256 380 C200 380 180 320 200 270 C210 245 230 230 240 200 C250 170 245 140 256 110 C270 145 315 195 315 250 C315 320 295 380 256 380 Z" fill="url(#flameGrad)" />
    <!-- Núcleo da Chama -->
    <path d="M256 370 C230 370 220 335 230 305 C235 290 245 280 250 260 C255 240 252 225 256 210 C265 230 290 260 290 295 C290 335 275 370 256 370 Z" fill="#FEF08A" />
  </g>

  <!-- Coração de Vitalidade (Base Direita) -->
  <path d="M300 270 C300 250 315 235 335 235 C350 235 360 245 365 255 C370 245 380 235 395 235 C415 235 430 250 430 270 C430 300 390 335 365 350 C340 335 300 300 300 270 Z" fill="#FB7185" opacity="0.9" />

  <!-- Pequenas Faíscas de Energia -->
  <circle cx="160" cy="150" r="10" fill="#FDE047" />
  <circle cx="370" cy="140" r="14" fill="#FDE047" />
  <circle cx="340" cy="90" r="8" fill="#FDE047" />
</svg>
