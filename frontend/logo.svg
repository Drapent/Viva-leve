    <path d="M150 330 C130 230 180 160 256 160 C256 240 220 330 150 330 Z" fill="#34D399" />
    <path d="M256 380 C200 380 180 320 200 270 C210 245 230 230 240 200 C250 170 245 140 256 110 C270 145 315 195 315 250 C315 320 295 380 256 380 Z" fill="url(#flameGradL)" />
    <path d="M256 370 C230 370 220 335 230 305 C235 290 245 280 250 260 C255 240 252 225 256 210 C265 230 290 260 290 295 C290 335 275 370 256 370 Z" fill="#FEF08A" />
    <path d="M300 270 C300 250 315 235 335 235 C350 235 360 245 365 255 C370 245 380 235 395 235 C415 235 430 250 430 270 C430 300 390 335 365 350 C340 335 300 300 300 270 Z" fill="#FB7185" />
